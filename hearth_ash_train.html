<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1c120c" />
<title>Hearth &amp; Ash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2a1c;
    --ink-soft: #6b5440;
    --paper: #f2e6c9;
    --paper-dark: #e4d3ad;
    --brass: #c9a25a;
    --brass-dark: #8a6a2e;
    --wood: #4a2c1b;
    --rust: #9a3b2a;
    --night: #120d0a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #2a1a10 0%, #120b07 70%);
    color: var(--ink);
    font-family: 'IM Fell English', Georgia, serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #viewport { position: fixed; inset: 0; height: 100dvh; overflow: hidden; }
  #stage {
    position: absolute; left: 0; top: 0;
    width: 400px; height: 860px;
    transform-origin: 0 0;
    overflow: hidden;
    background: #1c120c;
  }
  #car { position: absolute; inset: 0; will-change: transform; }
  #scenery { position: absolute; left: 0; top: 84px; width: 400px; height: 220px; }
  #scene-svg { position: absolute; left: 0; top: 0; width: 400px; height: 860px; pointer-events: none; }
  #scene-svg .tap { pointer-events: auto; cursor: pointer; }
  /* glint = "this needs you now" (only on when it means something) */
  #scene-svg .tap.glint { animation: glint 1.8s ease-in-out infinite; }
  @keyframes glint {
    0%, 100% { filter: none; }
    50% { filter: brightness(1.25) drop-shadow(0 0 4px rgba(255, 214, 140, .95)); }
  }
  #scene-svg .tap.bump { animation: bump .4s ease; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bump { 35% { transform: scale(1.05, .95); } 70% { transform: scale(.98, 1.02); } }
  .spk { pointer-events: none; }
  .spk path { transform-box: fill-box; transform-origin: center; animation: spk 1.8s ease-in-out infinite; }
  @keyframes spk { 0%, 100% { transform: scale(.3) rotate(0deg); opacity: .2; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
  .slate-cell.pop { animation: slatePop .5s ease; transform-box: fill-box; transform-origin: center; }
  @keyframes slatePop { 40% { transform: scale(1.35); } }
  .flyer {
    position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; z-index: 46; pointer-events: none;
    display: flex; align-items: center; justify-content: center; color: #3b2a1c; background: #f2e6c9; border-radius: 50%;
    box-shadow: 0 0 0 2px #c9a25a, 0 0 12px rgba(255,210,130,.8);
  }
  .hidden { display: none !important; }
  .lowblink { animation: lowblink .9s ease-in-out infinite; }
  @keyframes lowblink { 50% { opacity: .3; } }
  .exp-hp { display: flex; align-items: center; gap: 4px; color: #e98a7a; margin-top: 2px; }
  .exp-hp .bar { width: 74px; height: 8px; border: 1.3px solid #f0dfb8; border-radius: 2px; overflow: hidden; background: rgba(0,0,0,.3); }
  .exp-hp .bar i { display: block; height: 100%; background: #d9604a; transition: width .3s; }
  .exp-hp.low .bar i { background: #ff3b2a; animation: lowblink .9s ease-in-out infinite; }

  /* animated bits inside svg */
  .steam { animation: steam 3.2s ease-out infinite; opacity: 0; }
  .steam.s2 { animation-delay: 1.1s; }
  .steam.s3 { animation-delay: 2.1s; }
  @keyframes steam {
    0% { opacity: 0; transform: translateY(0) scale(.8); }
    25% { opacity: .55; }
    100% { opacity: 0; transform: translateY(-22px) scale(1.4); }
  }
  .steam { transform-box: fill-box; transform-origin: center; }
  .tail-swish { transform-box: fill-box; transform-origin: 0% 100%; animation: swish 2.6s ease-in-out infinite; }
  @keyframes swish { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(14deg); } }
  .breathe { transform-box: fill-box; transform-origin: center bottom; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.07); } }
  .drip { animation: drip 2.4s ease-in infinite; }
  @keyframes drip { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .9; } 100% { transform: translateY(18px); opacity: 0; } }
  .twinkle { animation: twinkle 2.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .record-spin { transform-box: fill-box; transform-origin: center; animation: spin 1.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #cat { transition: opacity .45s ease; }

  /* toasts & floaters */
  #toasts { position: absolute; left: 0; right: 0; top: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 40; }
  .toast {
    font-family: 'Caveat', cursive; font-size: 21px; line-height: 1.1;
    background: var(--paper); color: var(--ink);
    padding: 6px 14px 7px; max-width: 320px; text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.35);
    transform: rotate(-1deg);
    animation: toastIn .3s ease-out, toastOut .5s ease-in forwards 2.6s;
  }
  .toast:nth-child(even) { transform: rotate(.8deg); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-10px) rotate(-1deg); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }
  .floater {
    position: absolute; z-index: 45; pointer-events: none;
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 22px; color: #ffe2a3;
    text-shadow: 0 1px 0 #3b2a1c, 0 0 6px rgba(0,0,0,.6);
    animation: floatUp 1.4s ease-out forwards; white-space: nowrap;
    transform: translateX(-50%);
  }
  @keyframes floatUp { to { opacity: 0; margin-top: -40px; } }
  .heart { position: absolute; z-index: 45; pointer-events: none; color: #e9806e; font-size: 16px; animation: heartUp 1.6s ease-out forwards; }
  @keyframes heartUp { to { opacity: 0; transform: translate(var(--dx), -46px) scale(1.3); } }

  /* paper modals */
  #paper-bd {
    position: absolute; inset: 0; z-index: 60;
    background: rgba(18, 10, 5, .58);
    display: none; align-items: center; justify-content: center;
  }
  #paper-bd.show { display: flex; animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } }
  .paper {
    position: relative; width: 344px; max-height: 740px; overflow-y: auto;
    padding: 24px 22px 22px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(120,80,30,.12), transparent 45%),
      var(--paper);
    color: var(--ink);
    box-shadow: 0 14px 40px rgba(0,0,0,.55), inset 0 0 40px rgba(140,100,50,.18);
    transform: rotate(-.7deg);
    animation: paperIn .35s cubic-bezier(.2,.9,.3,1.2);
    scrollbar-width: none;
  }
  .paper::-webkit-scrollbar { display: none; }
  @keyframes paperIn { from { opacity: 0; transform: translateY(30px) rotate(-3deg) scale(.96); } }
  .paper h2 { font-family: 'IM Fell English SC', serif; font-weight: normal; font-size: 26px; margin: 0 0 4px; letter-spacing: .5px; }
  .paper .sub { font-style: italic; color: var(--ink-soft); font-size: 15px; margin-bottom: 12px; }
  .paper p { font-size: 17px; line-height: 1.35; margin: 8px 0; }
  .paper .close-x {
    position: absolute; right: 12px; top: 8px; font-family: 'Caveat', cursive; font-size: 28px;
    color: var(--ink-soft); background: none; border: 0; cursor: pointer; padding: 4px 8px;
  }
  .ink-btn {
    display: block; width: 100%; text-align: left; margin: 8px 0 0;
    font-family: inherit; font-size: 16px; color: var(--ink);
    background: rgba(255,255,255,.18); border: 1.5px solid rgba(59,42,28,.55);
    border-radius: 3px; padding: 9px 12px; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .ink-btn:active { transform: scale(.98); }
  .ink-btn:hover { background: rgba(255,255,255,.4); }
  .ink-btn[disabled] { opacity: .45; cursor: default; }
  .ink-btn .need { display: block; font-size: 13px; font-style: italic; color: var(--rust); }
  .stamp {
    display: inline-block; font-family: 'IM Fell English SC', serif; font-size: 16px; letter-spacing: 1px;
    color: var(--rust); border: 2px solid var(--rust); padding: 3px 12px 2px; border-radius: 3px;
    transform: rotate(-4deg); background: transparent; cursor: pointer;
  }
  .stamp[disabled] { opacity: .35; cursor: default; }
  .stamp.done { color: #3f6b4a; border-color: #3f6b4a; cursor: default; }

  .paper.telegram {
    background: repeating-linear-gradient(0deg, transparent 0 26px, rgba(120,90,40,.08) 26px 27px), #efe0b1;
    font-family: 'Special Elite', monospace;
  }
  .paper.telegram .tg-head {
    font-family: 'IM Fell English SC', serif; font-size: 13px; letter-spacing: 3px; text-align: center;
    border-bottom: 2px double var(--ink-soft); padding-bottom: 6px; margin-bottom: 10px; color: var(--ink-soft);
  }
  .paper.telegram h2 { font-family: 'Special Elite', monospace; font-size: 20px; text-transform: uppercase; }
  .paper.telegram p { font-size: 15px; }
  .paper.telegram .ink-btn { font-family: 'Special Elite', monospace; font-size: 14px; }
  .paper.telegram .tg-strip { display: inline-block; background: #f7efd4; padding: 0 4px; box-shadow: 0 1px 0 rgba(0,0,0,.08); }

  .paper.journal {
    background: repeating-linear-gradient(transparent 0 29px, rgba(70,100,150,.28) 29px 30px), #f6eedb;
    background-position: 0 14px;
    font-family: 'Caveat', cursive;
    border-left: 3px double rgba(170,60,60,.35);
  }
  .paper.journal h2 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 32px; }
  .paper.journal .entry { font-size: 21px; line-height: 30px; }
  .paper.journal .entry .d { color: var(--ink-soft); font-size: 17px; margin-right: 6px; }
  .paper.journal .ink-btn { font-family: 'Caveat', cursive; font-size: 21px; }

  .paper.blueprint {
    background:
      linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px) 0 0/18px 18px,
      linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px) 0 0/18px 18px,
      #234869;
    color: #e6eef5; box-shadow: 0 14px 40px rgba(0,0,0,.6), inset 0 0 50px rgba(0,0,0,.35);
    font-family: 'Special Elite', monospace;
  }
  .paper.blueprint h2 { font-family: 'Special Elite', monospace; font-size: 21px; color: #fff; }
  .paper.blueprint .sub { color: #a9c1d6; font-family: 'IM Fell English', serif; }
  .paper.blueprint .close-x { color: #a9c1d6; }
  .bp-tabs { display: flex; gap: 8px; margin: 6px 0 12px; }
  .bp-tabs button {
    flex: 1; font-family: 'Special Elite', monospace; font-size: 14px; color: #a9c1d6;
    background: transparent; border: 1.5px dashed rgba(230,238,245,.35); padding: 7px; cursor: pointer;
  }
  .bp-tabs button.on { color: #fff; border-style: solid; border-color: #e6eef5; background: rgba(255,255,255,.08); }
  .bp-item { border: 1px solid rgba(230,238,245,.35); padding: 10px 12px; margin-bottom: 9px; position: relative; }
  .bp-item.built { border-color: rgba(160,220,180,.6); }
  .bp-item.locked { opacity: .45; border-style: dashed; }
  .bp-item .nm { font-size: 15px; color: #fff; }
  .bp-item .ds { font-family: 'IM Fell English', serif; font-size: 14px; color: #c3d4e3; margin: 3px 0 8px; line-height: 1.3; }
  .bp-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bp-item .stamp { color: #ffd38a; border-color: #ffd38a; }
  .bp-item .stamp.done { color: #9fe0b3; border-color: #9fe0b3; }
  .cost { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
  .cost span { display: inline-flex; align-items: center; gap: 2px; }
  .cost span.short { color: #ff9f8a; }
  .engine-track { display: flex; gap: 6px; margin: 4px 0 12px; }
  .engine-track i { flex: 1; height: 8px; border: 1px solid #a9c1d6; }
  .engine-track i.on { background: #ffd38a; border-color: #ffd38a; box-shadow: 0 0 6px #ffd38a; }

  .prov-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px dashed rgba(59,42,28,.25); font-size: 17px; }
  .prov-row .ct { margin-left: auto; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; }
  .pips { display: inline-flex; gap: 3px; }
  .pips b { width: 9px; height: 9px; border-radius: 50%; border: 1.3px solid var(--ink); display: inline-block; }
  .pips b.f { background: var(--ink); }
  .vit-row { display: flex; align-items: center; justify-content: space-between; font-size: 16px; padding: 3px 0; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

  /* expedition */
  #expedition {
    position: absolute; inset: 0; z-index: 30; display: none; overflow: hidden;
    background: linear-gradient(#7a6a7e, #d79a6c 55%, #5b4636 55.2%, #3d2c20);
  }
  #expedition.show { display: block; animation: fadeIn .4s ease-out; }
  #exp-sky { position: absolute; inset: 0; pointer-events: none; }
  .exp-head { position: absolute; top: 18px; left: 0; right: 0; text-align: center; color: #f6e7c4; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .exp-head .t { font-family: 'IM Fell English SC', serif; font-size: 26px; }
  .exp-head .s { font-family: 'Caveat', cursive; font-size: 19px; opacity: .9; }
  #bld { position: absolute; left: 24px; right: 24px; bottom: 150px; display: flex; flex-direction: column; }
  .roof {
    height: 34px; background: #2c201a; margin: 0 -8px; clip-path: polygon(4% 100%, 50% 0, 96% 100%);
    position: relative;
  }
  .roof.flat { clip-path: none; height: 14px; margin: 0 -4px; }
  .sign-board {
    align-self: center; margin-bottom: -2px; z-index: 2;
    font-family: 'IM Fell English SC', serif; font-size: 15px; letter-spacing: 1px;
    background: #e9d6a8; color: var(--ink); padding: 3px 12px; border: 2px solid #6b4a2a;
    box-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  .floors { display: flex; flex-direction: column-reverse; border: 6px solid #2c201a; border-top: 0; background: #2c201a; gap: 6px; }
  .floor { display: flex; gap: 6px; position: relative; }
  .floor .flabel {
    position: absolute; left: -22px; top: 50%; transform: translateY(-50%) rotate(-90deg);
    font-family: 'IM Fell English SC', serif; font-size: 11px; color: #f0dfb8; opacity: .7; white-space: nowrap;
  }
  .room {
    flex: 1; min-height: 96px; position: relative; padding: 8px 8px 8px;
    border: 0; text-align: left; cursor: pointer; color: var(--ink);
    background: var(--wall, #c9b48c);
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 12px);
    box-shadow: inset 0 -10px 0 rgba(60,40,25,.45), inset 0 0 18px rgba(0,0,0,.35);
    transition: filter .2s, transform .1s;
    font-family: inherit;
  }
  .room:active { transform: scale(.98); }
  .room .rn { font-family: 'IM Fell English SC', serif; font-size: 13px; line-height: 1.1; }
  .room .hint { font-family: 'Caveat', cursive; font-size: 17px; line-height: 1.05; margin-top: 4px; color: #4a3424; }
  .room .door {
    position: absolute; right: 8px; bottom: 10px; width: 18px; height: 30px; background: #5b3b25;
    border-radius: 2px 2px 0 0; box-shadow: inset -3px 0 0 rgba(0,0,0,.25);
  }
  .room .door::after { content: ''; position: absolute; left: 3px; top: 15px; width: 3px; height: 3px; border-radius: 50%; background: #e3c27a; }
  .room.explored { filter: saturate(.55) brightness(.82); cursor: default; }
  .room.explored .door { transform: perspective(60px) rotateY(-55deg); transform-origin: right; background: #2b1c12; }
  .room .res {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 18px; margin-top: 4px; display: flex; align-items: center; gap: 4px;
  }
  .room .res.bad { color: #8b2a1d; }
  .room .res.good { color: #2f5a35; }
  .room.pending { cursor: pointer; filter: none; }
  .room.locked { cursor: default; background: #1d1511 !important; box-shadow: inset 0 0 20px #000; }
  .room.locked .rn, .room.locked .hint { color: #6d5a48; }
  .room.cannot { cursor: default; }
  .room.cat-room .hint { color: #7a3f12; }
  .room .stairs-badge {
    position: absolute; left: 6px; bottom: 12px; display: inline-flex; align-items: center; gap: 3px;
    font-family: 'IM Fell English SC', serif; font-size: 11px; color: #f6e7c4; background: #6b4a2a; padding: 2px 6px 2px 4px; border-radius: 3px;
    box-shadow: 0 1px 0 rgba(0,0,0,.4); animation: badgeBob 1.6s ease-in-out infinite;
  }
  @keyframes badgeBob { 50% { transform: translateY(-2px); } }
  .room .stairs-art { position: absolute; left: 0; bottom: 10px; width: 64px; height: 52px; opacity: .6; pointer-events: none; }
  .room.stairs.explored { filter: none; }
  .room .res.up { color: #6b4a2a; }
  .room.locked .lock-note { font-family: 'Caveat', cursive; font-size: 15px; color: #8a7560; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  .boiler {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 3px 10px; border-radius: 12px;
    background: rgba(20,12,8,.55); font-family: 'IM Fell English SC', serif; font-size: 12px; color: #f0dfb8; text-shadow: none;
  }
  .boiler .bar { display: inline-flex; gap: 2px; }
  .boiler .bar i { width: 6px; height: 10px; border-radius: 1px; background: #5a4a3a; }
  .boiler .bar i.on { background: #ffb347; box-shadow: 0 0 4px #ff9a2a; }
  .boiler.low { color: #ffb0a0; animation: lowPulse 1s ease-in-out infinite; }
  .boiler.low .bar i.on { background: #e0553a; box-shadow: 0 0 4px #e0553a; }
  @keyframes lowPulse { 50% { background: rgba(120,20,10,.6); } }
  .bag.shake { animation: shake .4s; }
  .name-input {
    display: block; width: 100%; margin: 6px 0 2px; padding: 4px 10px; font-family: 'Caveat', cursive; font-size: 26px; color: var(--ink);
    background: rgba(255,255,255,.35); border: 0; border-bottom: 2px solid var(--ink-soft); outline: none; user-select: text; -webkit-user-select: text;
  }
  .paper .todo-goal { font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700; margin: 2px 0 4px; }
  .paper .todo-row { display: flex; align-items: center; gap: 8px; font-size: 16px; padding: 3px 0; line-height: 1.2; }
  .paper .todo-row .ok { color: #3f6b4a; } .paper .todo-row .no { color: var(--rust); }
  .paper .todo-row small { color: var(--ink-soft); font-style: italic; }
  .paper h3 { font-family: 'IM Fell English SC', serif; font-weight: normal; font-size: 17px; margin: 14px 0 4px; border-bottom: 1px dashed rgba(59,42,28,.35); }
  .ink-btn svg { vertical-align: -3px; }
  .ledger-row { display: flex !important; gap: 10px; align-items: flex-start; }
  .ledger-row .box {
    flex: none; width: 20px; height: 20px; border: 2px solid var(--ink); border-radius: 3px; margin-top: 4px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1;
  }
  .ledger-row:not(.on) { opacity: .8; }
  .ledger-row:not(.on) b { text-decoration: line-through; }
  .ledger-row .lc { margin-left: 6px; color: var(--ink-soft); }
  .ledger-free { font-size: 20px; padding: 8px 4px 0; color: #3f6b4a; }
  #exp-ground-train { position: absolute; left: -30px; bottom: 96px; width: 190px; height: 60px; pointer-events: none; }
  #exp-hud {
    position: absolute; left: 0; right: 0; bottom: 0; height: 104px;
    background: linear-gradient(#4a2c1b, #33200f); border-top: 4px solid var(--brass-dark);
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  }
  .bag {
    flex: 1; height: 80px; position: relative; padding: 18px 10px 8px;
    background: #8a7350; border-radius: 10px 10px 18px 18px;
    background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 3px, transparent 3px 6px);
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), 0 3px 6px rgba(0,0,0,.4);
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
  }
  .bag::before {
    content: 'Canvas Bag'; position: absolute; top: 3px; left: 10px;
    font-family: 'IM Fell English SC', serif; font-size: 11px; color: #3b2a1c; opacity: .75;
  }
  .bag .slot {
    border: 1.5px dashed rgba(59,42,28,.45); border-radius: 6px; display: flex; align-items: center; justify-content: center;
    color: var(--ink); background: rgba(255,255,255,.08); cursor: pointer; padding: 0;
  }
  .bag .slot.full { border-style: solid; background: #e9d9b4; }
  .bag .slot.sel { animation: wiggle .35s ease-in-out infinite; background: #f3c9b6; }
  @keyframes wiggle { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .energy { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #f0dfb8; }
  .energy .lbl { font-family: 'IM Fell English SC', serif; font-size: 11px; opacity: .8; }
  .candles { display: flex; gap: 3px; }
  .ticket {
    position: relative; width: 92px; height: 74px; border: 0; cursor: pointer;
    background: #e9d6a8; color: var(--ink);
    font-family: 'IM Fell English SC', serif; font-size: 14px; line-height: 1.1;
    border-left: 2px dashed rgba(59,42,28,.4); border-right: 2px dashed rgba(59,42,28,.4);
    box-shadow: 0 3px 6px rgba(0,0,0,.4);
    transform: rotate(2deg);
  }
  .ticket small { display: block; font-family: 'Caveat', cursive; font-size: 15px; color: var(--rust); margin-top: 3px; }

  /* combat */
  #combat { position: absolute; inset: 0; z-index: 35; overflow: hidden; }
  .cb-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 62% 42% at 50% 36%, rgba(255,214,150,.2), transparent 70%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.2) 0 2px, transparent 2px 26px),
      linear-gradient(#2c211c, #140e0b 62%);
  }
  .cb-bg::after {
    content: ''; position: absolute; left: 0; right: 0; top: 440px; height: 140px;
    background: repeating-linear-gradient(0deg, #2b1d14 0 18px, #1d130c 18px 20px);
    box-shadow: inset 0 30px 40px rgba(0,0,0,.6);
  }
  .cb-room { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-family: 'IM Fell English SC', serif; color: #c9b48c; font-size: 13px; letter-spacing: 3px; opacity: .8; }
  .cb-tag {
    position: absolute; top: 40px; left: 50%; width: 260px; transform: translateX(-50%) rotate(-1.5deg);
    background: var(--paper); padding: 9px 14px 10px; text-align: center; box-shadow: 0 6px 16px rgba(0,0,0,.6);
  }
  .cb-tag::before { content: ''; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; border-radius: 50%; background: #9a3b2a; transform: translateX(-50%); box-shadow: 0 2px 3px rgba(0,0,0,.5); }
  .cb-name { font-family: 'IM Fell English SC', serif; font-size: 23px; color: var(--ink); }
  .cb-track { height: 9px; border: 1.5px solid var(--ink); margin: 4px 8px; border-radius: 2px; overflow: hidden; }
  .cb-track i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, #8b2a1d 0 4px, #a8392a 4px 8px); transition: width .4s ease; }
  .cb-desc { font-family: 'Caveat', cursive; font-size: 17px; color: var(--ink-soft); line-height: 1.05; }
  #cb-mon { position: absolute; left: 40px; top: 150px; width: 320px; height: 300px; filter: drop-shadow(0 14px 14px rgba(0,0,0,.75)); }
  #cb-mon svg { width: 100%; height: 100%; overflow: visible; }
  #cb-mon .idle { animation: monIdle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes monIdle { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.025); } }
  #cb-mon.hit { animation: monHit .45s ease; }
  @keyframes monHit { 0% { filter: brightness(3.5); } 30% { transform: translateX(12px); } 60% { transform: translateX(-7px); } 100% { transform: none; } }
  #cb-mon.dodge { animation: monDodge .45s ease; }
  @keyframes monDodge { 45% { transform: translateX(-34px) rotate(-5deg); } }
  #cb-mon.lunge { animation: monLunge .42s ease; }
  @keyframes monLunge { 40% { transform: translateY(36px) scale(1.2); } }
  .cb-log { position: absolute; top: 462px; left: 22px; right: 22px; text-align: center; font-family: 'Caveat', cursive; font-size: 21px; color: #f0dfb8; line-height: 1.15; text-shadow: 0 2px 4px #000; }
  .cb-log b { color: #ffcf8a; }
  .cb-you { position: absolute; top: 530px; left: 22px; right: 22px; display: flex; justify-content: space-between; align-items: center; color: #f0dfb8; font-family: 'IM Fell English SC', serif; font-size: 13px; letter-spacing: .5px; }
  .cb-you .hp { display: flex; align-items: center; gap: 6px; }
  .cb-you .hpbar { width: 110px; height: 8px; border: 1.5px solid #f0dfb8; border-radius: 2px; overflow: hidden; }
  .cb-you .hpbar i { display: block; height: 100%; background: #d9604a; transition: width .3s; }
  .cb-actions { position: absolute; left: 18px; right: 18px; bottom: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .plaque {
    grid-column: span 2; display: flex; justify-content: space-between; align-items: center; text-align: left;
    padding: 11px 16px; border: 0; cursor: pointer; color: #f6e7c4; font-family: inherit;
    background: linear-gradient(#6a4129, #4a2c1b); border-radius: 4px;
    box-shadow: inset 0 0 0 2px #8a6a2e, 0 4px 0 #24150c;
  }
  .plaque .pn { font-family: 'IM Fell English SC', serif; font-size: 19px; }
  .plaque .ps { font-family: 'Caveat', cursive; font-size: 17px; color: #e6c890; }
  .plaque.small { grid-column: span 1; justify-content: center; gap: 6px; padding: 10px; }
  .plaque.run { background: linear-gradient(#4b4642, #2c2826); }
  .plaque[disabled] { opacity: .42; cursor: default; }
  .plaque:active:not([disabled]) { transform: translateY(2px); box-shadow: inset 0 0 0 2px #8a6a2e, 0 2px 0 #24150c; }
  #cb-flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 35%, rgba(170,20,10,.7)); }
  #cb-flash.on { animation: flash .55s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  #combat.shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translate(-7px,3px); } 40% { transform: translate(6px,-4px); } 60% { transform: translate(-4px,2px); } 80% { transform: translate(3px,-1px); } }
  .room.monster-room .hint { color: #8b2a1d; font-weight: 700; }

  /* title */
  #title {
    position: absolute; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 45%, rgba(40,24,14,.6), rgba(10,6,3,.92));
  }
  .big-ticket {
    width: 300px; padding: 26px 22px 20px; text-align: center; background: #ead7a6; color: var(--ink);
    box-shadow: 0 20px 50px rgba(0,0,0,.6); transform: rotate(-2deg);
    border: 2px dashed rgba(59,42,28,.35); outline: 8px solid #ead7a6;
  }
  .big-ticket .line { font-family: 'IM Fell English SC', serif; letter-spacing: 2px; font-size: 11px; white-space: nowrap; color: var(--ink-soft); }
  .big-ticket h1 { font-family: 'IM Fell English SC', serif; font-weight: normal; font-size: 40px; margin: 6px 0 2px; }
  .big-ticket .from { font-family: 'Caveat', cursive; font-size: 22px; margin-bottom: 16px; }
  .big-ticket .punch { display: flex; justify-content: space-between; font-family: 'Special Elite', monospace; font-size: 12px; border-top: 1px dashed var(--ink-soft); padding-top: 10px; margin-top: 14px; color: var(--ink-soft); }
  .board-btn {
    font-family: 'IM Fell English SC', serif; font-size: 20px; letter-spacing: 2px;
    color: #f6e7c4; background: #7c2f22; border: 0; padding: 10px 26px; cursor: pointer;
    box-shadow: 0 3px 0 #4a1a12; display: block; margin: 8px auto 0; min-width: 200px;
  }
  .board-btn.alt { background: transparent; color: var(--ink); box-shadow: none; font-size: 15px; text-decoration: underline; }
  #fade { position: absolute; inset: 0; background: #0d0806; opacity: 0; pointer-events: none; z-index: 70; transition: opacity .45s ease; }
  #fade.on { opacity: 1; }
</style>
</head>
<body>

        <path d="M107 334 l6 -7 l5 5 l4 -3 l3 5" stroke="#9a3b2a" fill="none" stroke-width="1.2" transform="rotate(6 115 330)"/>
        <rect x="90" y="340" width="22" height="16" fill="#dcc9a0" transform="rotate(3 101 348)"/>

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
}
function mixHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);

// =====================================================================
// Audio (Web Audio synthesis only)
// =====================================================================
const Audio = {
  ctx: null, master: null, on: true, rumble: null, rumbleGain: null, noiseBuf: null, music: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.on ? 0.9 : 0; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0); let last = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } // brown noise
      const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180;
      this.rumbleGain = this.ctx.createGain(); this.rumbleGain.gain.value = 0;
      this.inBus = this.bus(0); this.outBus = this.bus(0); this.cbBus = this.bus(0);
      src.connect(lp); lp.connect(this.rumbleGain); this.rumbleGain.connect(this.inBus); src.start();
      this.startAmbience(); this.setScene(this.scene);
    } catch (e) { this.ctx = null; }
  },
  setOn(v) { this.on = v; if (this.master) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.1); },
  setRumble(f) { if (this.rumbleGain) this.rumbleGain.gain.setTargetAtTime(0.02 + f * 0.11, this.ctx.currentTime, 0.3); },
  noise(dur, freq, type = 'bandpass', vol = 0.2, q = 1, when = 0, dest = null) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest || this.master); src.start(t, Math.random()); src.stop(t + dur + 0.05);
  },
  tone(freq, dur, type = 'sine', vol = 0.08, when = 0, slide = null, dest = null) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  clack(vol) {
    // two axles over a rail joint: clack-clack
    [0, 0.13].forEach(w => { this.noise(0.07, 1400, 'bandpass', 0.35 * vol, 2.5, w); this.tone(70, 0.09, 'sine', 0.12 * vol, w); });
  },
  whistle() {
    if (!this.ctx) return;
    [523, 659, 784].forEach(f => this.tone(f, 1.1, 'sine', 0.035, 0, f * 0.985));
    this.noise(1.0, 1800, 'bandpass', 0.05, 3);
  },
  hiss() { this.noise(1.4, 3500, 'highpass', 0.12, 0.7); },
  crackle() { this.noise(0.03, rnd(2000, 4000), 'bandpass', rnd(0.04, 0.1), 4); },
  paper() { this.noise(0.18, 2600, 'bandpass', 0.06, 0.8); },
  stoke() { this.noise(0.4, 500, 'lowpass', 0.25, 0.7); setTimeout(() => { for (let i = 0; i < 5; i++) this.noise(0.03, rnd(2000, 4000), 'bandpass', 0.12, 4, i * 0.06); }, 120); },
  click() { this.tone(900, 0.04, 'triangle', 0.05); this.noise(0.03, 3000, 'bandpass', 0.08, 2); },
  loot() { this.tone(660, 0.12, 'sine', 0.06); this.tone(880, 0.18, 'sine', 0.06, 0.08); },
  hurt() { this.tone(140, 0.3, 'sawtooth', 0.06, 0, 70); this.noise(0.3, 400, 'lowpass', 0.2); },
  door() { this.tone(180, 0.25, 'sawtooth', 0.03, 0, 120); },
  meow() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(560, t); o.frequency.exponentialRampToValueAtTime(820, t + 0.13); o.frequency.exponentialRampToValueAtTime(480, t + 0.42);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.5);
  },
  purr() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
    const g = this.ctx.createGain(); g.gain.value = 0;
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = 24; const lg = this.ctx.createGain(); lg.gain.value = 0.25;
    lfo.connect(lg); lg.connect(g.gain);
    const env = this.ctx.createGain(); env.gain.setValueAtTime(0.0001, t); env.gain.linearRampToValueAtTime(0.9, t + 0.3); env.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    src.connect(lp); lp.connect(g); g.connect(env); env.connect(this.master);
    src.start(t); lfo.start(t); src.stop(t + 1.9); lfo.stop(t + 1.9);
  },
  growl() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(70, t); o.frequency.linearRampToValueAtTime(55, t + 0.9);
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = 18; const lg = this.ctx.createGain(); lg.gain.value = 12; lfo.connect(lg); lg.connect(o.frequency);
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.12, t + 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t + 1);
    o.connect(f); f.connect(g); g.connect(this.master); o.start(t); lfo.start(t); o.stop(t + 1.05); lfo.stop(t + 1.05);
    this.noise(0.8, 300, 'lowpass', 0.15, 1);
  },
  swing() { this.noise(0.18, 1800, 'bandpass', 0.18, 0.6); },
  hit() { this.tone(90, 0.18, 'sine', 0.2, 0, 45); this.noise(0.12, 900, 'bandpass', 0.3, 1.2); },
  // ---- ambience: warm inside vs cold outside ----
  bus(v) { const g = this.ctx.createGain(); g.gain.value = v; g.connect(this.master); return g; },
  scene: 'title',
  setScene(name) {
    const wasIn = this.scene === 'inside' || this.scene === 'title';
    if (!wasIn && (name === 'inside' || name === 'title')) { this.step = 0; this.nextStep = 0; }
    if (name === 'combat' && this.scene !== 'combat') { this.cStep = 0; this.nextCStep = 0; }
    this.scene = name;
    if (!this.ctx || !this.inBus) return;
    const lv = { title: [0.55, 0, 0], inside: [1, 0, 0], outside: [0, 1, 0], combat: [0, 0.4, 1], silent: [0, 0, 0] }[name] || [1, 0, 0];
    const t = this.ctx.currentTime;
    [this.inBus, this.outBus, this.cbBus].forEach((b, i) => b.gain.setTargetAtTime(lv[i], t, 0.6));
  },
  startAmbience() {
    const c = this.ctx;
    const len = c.sampleRate; this.whiteBuf = c.createBuffer(1, len, c.sampleRate);
    const wd = this.whiteBuf.getChannelData(0); for (let i = 0; i < len; i++) wd[i] = Math.random() * 2 - 1;
    // reverbs: a small warm room inside, a huge cold space outside
    const mkIR = (sec, decay) => {
      const n = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, n, c.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
      return b;
    };
    const mkRev = (sec, decay, bus, wet) => { const cv = c.createConvolver(); cv.buffer = mkIR(sec, decay); const g = c.createGain(); g.gain.value = wet; cv.connect(g); g.connect(bus); return cv; };
    const send = (bus, rev, dry, wet) => {
      const g = c.createGain(), d = c.createGain(), w = c.createGain(); d.gain.value = dry; w.gain.value = wet;
      g.connect(d); d.connect(bus); g.connect(w); w.connect(rev); return g;
    };
    this.mIn = send(this.inBus, mkRev(1.6, 3, this.inBus, 0.5), 0.85, 0.3);
    this.mOut = send(this.outBus, mkRev(5, 2.2, this.outBus, 0.9), 0.45, 0.85);
    this.mCb = send(this.cbBus, mkRev(2.2, 2.6, this.cbBus, 0.6), 0.8, 0.35);
    // inside music goes through a warmth filter that closes when things get hard
    this.inTone = c.createBiquadFilter(); this.inTone.type = 'lowpass'; this.inTone.frequency.value = 4500; this.inTone.connect(this.mIn);

    // wind outside, and faintly through the walls when the car is cold
    const w = c.createBufferSource(); w.buffer = this.noiseBuf; w.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.8;
    const wl = c.createOscillator(); wl.frequency.value = 0.07; const wld = c.createGain(); wld.gain.value = 320; wl.connect(wld); wld.connect(bp.frequency);
    const wg = c.createGain(); wg.gain.value = 0.2;
    const gl = c.createOscillator(); gl.frequency.value = 0.11; const gld = c.createGain(); gld.gain.value = 0.11; gl.connect(gld); gld.connect(wg.gain);
    w.connect(bp); bp.connect(wg); wg.connect(this.outBus); w.start(0, Math.random()); wl.start(); gl.start();
    const wIn = c.createGain(); wIn.gain.value = 0; bp.connect(wIn); wIn.connect(this.inBus); this.inWind = wIn;

    // outside: a slow-breathing low string drone (D) whose filter opens with danger
    const dlp = c.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 240; dlp.Q.value = 3;
    const dl = c.createOscillator(); dl.frequency.value = 0.045; const dlg = c.createGain(); dlg.gain.value = 140; dl.connect(dlg); dlg.connect(dlp.frequency); dl.start();
    const dg = c.createGain(); dg.gain.value = 0.03; dlp.connect(dg); dg.connect(this.mOut); this.droneGain = dg; this.droneLp = dlp;
    const sw = c.createOscillator(); sw.frequency.value = 0.06; const swg = c.createGain(); swg.gain.value = 0.012; sw.connect(swg); swg.connect(dg.gain); sw.start();
    [36.7, 36.9, 55, 73.6].forEach(f => { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(dlp); o.start(); });
    // a thin, cold high shimmer that drifts in and out
    const sh = c.createGain(); sh.gain.value = 0.004; sh.connect(this.mOut);
    [587.3, 880, 881.6].forEach(f => { const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(sh); o.start(); });
    const shl = c.createOscillator(); shl.frequency.value = 0.025; const shg = c.createGain(); shg.gain.value = 0.004; shl.connect(shg); shg.connect(sh.gain); shl.start();

    this.step = 0; this.nextStep = 0; this.cStep = 0; this.nextCStep = 0; this.nextPhrase = 0; this.nextRuin = 0;
    setInterval(() => this.tick(), 100);
  },
  mtof: n => 440 * Math.pow(2, (n - 69) / 12),
  minor(n) { const pc = n % 12; return (pc === 6 || pc === 11) ? n - 1 : n; },
  // ---- instruments ----
  ep(n, t, dur, vol, dest) { // warm electric piano (FM)
    const c = this.ctx, f = this.mtof(n);
    const car = c.createOscillator(); car.type = 'sine'; car.frequency.value = f;
    const mod = c.createOscillator(); mod.type = 'sine'; mod.frequency.value = f;
    const mg = c.createGain(); mg.gain.setValueAtTime(f * 1.1, t); mg.gain.exponentialRampToValueAtTime(f * 0.06, t + 0.9);
    mod.connect(mg); mg.connect(car.frequency);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.35); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    car.connect(g); g.connect(dest); car.start(t); mod.start(t); car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
  },
  celesta(n, t, vol, dest) { // music-box / celesta
    const c = this.ctx, f = this.mtof(n);
    [[1, 1, 1.7], [4, 0.16, 0.3], [2.005, 0.12, 0.9]].forEach(([m, a, d]) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol * a, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + 0.05);
    });

const LOOT_DEST = { fuel: [124, 536, 't-basket'], food: [344, 404, 't-pantry'], water: [344, 440, 't-pantry'], meds: [330, 482, 't-pantry'], cloth: [366, 482, 't-pantry'], scrap: [326, 350, 't-pantry'], parts: [366, 350, 't-pantry'] };

  const el = $(id); if (!el) return;
  el.classList.remove('bump'); void el.getBoundingClientRect(); el.classList.add('bump');
  el.addEventListener('animationend', () => el.classList.remove('bump'), { once: true });

function flyLoot(items, from) {
  items.forEach((k, i) => {
    if (!LOOT_DEST[k]) return;
    resLag[k] = (resLag[k] || 0) + 1;
    setTimeout(() => {
      const [tx, ty, tgt] = LOOT_DEST[k], [fx, fy] = from;
      const cx = (fx + tx) / 2 + rnd(-40, 40), cy = Math.min(fy, ty) - rnd(60, 110);
      const el = document.createElement('div'); el.className = 'flyer'; el.innerHTML = icon(k, 18);
      $('stage').appendChild(el);
      const frames = [];
      for (let j = 0; j <= 12; j++) {
        const t = j / 12, u = 1 - t;
        const x = u * u * fx + 2 * u * t * cx + t * t * tx, y = u * u * fy + 2 * u * t * cy + t * t * ty;
        frames.push({ transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(0.5 + Math.sin(t * Math.PI) * 0.7).toFixed(2)})`, opacity: j === 0 ? 0 : 1 });
      }
      let landed = false;
      const done = () => { if (landed) return; landed = true; el.remove(); resLag[k] = Math.max(0, (resLag[k] || 0) - 1); Audio.land(); refresh(); bump(tgt); bumpSlate(k); };
      if (el.animate) { el.animate(frames, { duration: 850, easing: 'ease-in-out' }).onfinish = done; setTimeout(done, 1500); } else done();
    }, 250 + i * 180);
  });
}

// ---- knock at the door: a passing trader ----
const VAL = { food: 1, water: 1, fuel: 1, scrap: 1.2, cloth: 1.5, meds: 2, parts: 3 };
const VISITORS = [
  'A woman on a pump handcar keeps pace with the train, a goat asleep in her cart. She raps on the door with a ladle.',
  'A boy in an oversized coat has hopped onto the step. His sack clinks when he shrugs.',
  'An old porter rides the step outside, a lantern on a pole. He taps the glass with a brass key.',
  'A tall figure in a gas mask holds up a hand-lettered card against the window: TRADE?'
];
let currentOffers = [];
function makeOffers() {
  const s = state, g = currentGoal();
  const need = g.cost ? Object.keys(g.cost).filter(k => s.res[k] < g.cost[k]) : [];
  const keys = Object.keys(VAL).sort(() => Math.random() - 0.5);
  const offers = [];
  for (const give of [...need, ...keys]) {
    if (offers.length >= 2) break;
    if (offers.some(o => o.give === give)) continue;
    const payable = keys.filter(k => k !== give && !(g.cost && g.cost[k]) && s.res[k] >= 2).sort((a, b) => s.res[b] * VAL[b] - s.res[a] * VAL[a]);
    if (!payable.length) continue;
    const pay = payable[Math.random() < 0.7 ? 0 : Math.min(1, payable.length - 1)];
    const gq = VAL[give] >= 2 ? 1 : (Math.random() < 0.5 ? 2 : 1);
    const pq = Math.max(1, Math.round(VAL[give] * gq * 1.25 / VAL[pay]));
    if (s.res[pay] < pq) continue;
    offers.push({ give, gq, pay, pq, helps: need.includes(give) });
  }
  return offers;
}
const qtyIcon = (k, n) => `${n} ${icon(k, 15)} ${RES[k].short}`;
function openTrade() {
  currentOffers = makeOffers();
  let h = `<h2>A knock at the door</h2><p>${pick(VISITORS)}</p>`;
  if (!currentOffers.length) h += `<p style="font-family:Caveat;font-size:21px">"Not much to spare, have you? Here. For the road."</p><button class="ink-btn" data-act="tradeGift">Take the tin of food and thank them</button>`;
  else {
    h += `<div class="sub">They'd trade:</div>`;
    currentOffers.forEach((o, i) => h += `<button class="ink-btn" data-act="trade" data-arg="${i}">Give ${qtyIcon(o.pay, o.pq)} &rarr; get ${qtyIcon(o.give, o.gq)}${o.helps ? '<span class="need" style="color:#3f6b4a">you need this for your to-do</span>' : ''}</button>`);
    h += `<button class="ink-btn" data-act="close">Shake your head and close the door</button>`;
  }
  openPaper('', h);
}

// =====================================================================
// Simulation
// =====================================================================
let stuckTimer = 0, jointAcc = 0, saveTimer = 0, crackleT = 0;
let musicOn = false;
let paperOpen = false, paperLocked = false, titleOpen = true;
let wasOutOfFuel = false;

function update(dt) {
  const s = state;
  if (s.mode !== 'travel' || s.dead) return;
  const selfRun = selfRunning();
  const burnMult = (s.engine > 0 ? ENGINE[s.engine - 1].burn : 1) * (1 + 0.6 * coldness());
  const sf = s.speed / MAX_SPEED;
  if (!selfRun && s.fuel > 0) s.fuel = Math.max(0, s.fuel - BASE_BURN * burnMult * (0.3 + 0.7 * sf) * dt);
  const powered = s.fuel > 0 || selfRun;
  if (s.braking) s.speed = Math.max(0, s.speed - 36 * dt);
  else if (powered) s.speed = Math.min(maxSpeed(), s.speed + 8 * dt);
  else s.speed = Math.max(0, s.speed - 5 * dt);
  if (!powered && !wasOutOfFuel) { wasOutOfFuel = true; toast('The fire is out. The train is coasting...'); addLog('The firebox went cold and the train coasted.'); }
  if (powered) wasOutOfFuel = false;

  const px = (s.speed / MAX_SPEED) * PX_PER_SEC * dt;
  s.scroll += px; s.km += s.speed * dt / 240;
  s.frost = clamp(s.frost + s.speed * dt / 240 - frostRate() * dt / DAY_LEN, 0, 60);
  frostAlerts();
  s.buildings.forEach(b => b.x -= px);
  s.buildings = s.buildings.filter(b => b.x > -220);
  s.spawnAcc += px;
  if (s.spawnAcc >= s.nextGap) {
    s.spawnAcc = 0; s.nextGap = rnd(2000, 3000);
    spawnBuilding(s.spawned === 0 ? 'apartment' : null);
  }
  s.buildings.forEach(b => {
    if (!b.cued && !b.visited && b.x < WINDOWS[1].x + WINDOWS[1].w - 30 && b.x + b.w > 0) { b.cued = true; cueBuilding(b); }
  });
  if (s.knockAt && s.t >= s.knockAt && !s.braking) { s.knockAt = null; knockAtDoor(); }
  jointAcc += px;
  if (jointAcc > 96) { jointAcc -= 96; Audio.clack(0.4 + 0.6 * sf); }

  // braking finished -> expedition
  if (s.braking && s.speed <= 0) {
    s.braking = false; s.speed = 0;
    const b = s.buildings.find(bb => bb.id === s.brakeTarget);
    if (b && buildingVisible(b)) enterExpedition(b);
    else { toast('Too late! The train rolled past it.'); addLog('Braked too late and overshot a building.'); Audio.click(); updateBrakeVisual(); }
  }

  // heat
  const cold = coldness();
  const heatTarget = (selfRun ? 86 : (s.fuel > 0 ? 70 + s.engine * 3 - cold * 14 : (s.engine >= 3 ? 50 - cold * 10 : 6))) - (s.frost <= 0 ? 22 : 0);
  s.heat += (heatTarget - s.heat) * 0.07 * dt;

  // time & vitals
  s.t += dt / DAY_LEN;
  const k = dt / DAY_LEN;
  s.vit.hunger = clamp(s.vit.hunger - 22 * (1 + 0.3 * cold) * k, 0, 100);
  s.vit.thirst = clamp(s.vit.thirst - 26 * (1 + 0.3 * cold) * (hasCond('fever') ? 1.7 : 1) * k, 0, 100);
  let hpd = 0;
  if (s.vit.hunger <= 0) hpd -= 22; if (s.vit.thirst <= 0) hpd -= 30; if (s.heat < 22) hpd -= 16;
  if (hpd === 0 && s.vit.hunger > 40 && s.vit.thirst > 40 && s.heat > 40) hpd = 8 + comfort() * 0.5;
  if (hasCond('cut')) hpd = Math.min(hpd, 0) - 6;
  if (s.frost <= 0) hpd = Math.min(hpd, 0) - 14;   // caught by the frost
  s.vit.hp = clamp(s.vit.hp + hpd * k, 0, 100);
  if (s.cat.rescued) s.cat.hunger = clamp(s.cat.hunger - 24 * k, 0, 100);

  // stuck fallback: out of fuel, out of firewood, nothing to stop at
  if (s.speed < 0.5 && !selfRun && s.fuel <= 0 && s.res.fuel <= 0 && !s.buildings.some(b => !b.visited && buildingVisible(b))) {
    stuckTimer += dt;
    if (stuckTimer > 3) {
      stuckTimer = 0; spawnBuilding('shed', 240);
      toast('You have rolled to a stop beside an old trackside shed.');
    }
  } else stuckTimer = 0;

  if (s.vit.hp <= 0) return die();
  if (s.t >= 1 && !paperOpen) triggerNight();

  updateCat(dt);
  saveTimer += dt; if (saveTimer > 4) { saveTimer = 0; save(); }
  tagTimer += dt; if (tagTimer > 1) { tagTimer = 0; renderTag(); updateBrakeVisual(); updateGlints(); }
}
let tagTimer = 0;

// =====================================================================
// Render loop (visual only)
// =====================================================================
let rockT = 0;
function spring(g, target, dt) {
  const acc = (target - g.shown) * 60 - g.vel * 9;
  g.vel += acc * dt; g.shown += g.vel * dt;
}
function render(dt) {
  const s = state;
  clockT += dt;
  drawScenery(dt);
  // gauges
  spring(GAUGES.fuel, selfRunning() ? 1 : s.fuel / 100, dt);
  spring(GAUGES.speed, clamp(s.frost / 40, 0, 1) + (s.speed > 1 ? Math.sin(clockT * 9) * 0.004 : 0), dt);
  $('frost-num').textContent = selfRunning() && s.frost >= 40 ? 'far' : `${Math.floor(s.frost)} km`;
  $('frost-num').setAttribute('fill', s.frost < 9 ? '#a8392a' : '#2c4b70');
  spring(GAUGES.heat, s.heat / 100, dt);
  for (const k in GAUGES) {
    const g = GAUGES[k]; const a = -120 + clamp(g.shown, -0.03, 1.03) * 240;
    const el = $('needle-' + k); if (el) el.setAttribute('transform', `rotate(${a.toFixed(2)} ${g.cx} ${g.cy})`);
  }
  // clock
  const ang = s.t * 360;
  const [hx, hy] = polar(352, 40, 15, ang);
  $('clock-hand').setAttribute('x2', hx.toFixed(1)); $('clock-hand').setAttribute('y2', hy.toFixed(1));
  // fire
  const fireLvl = selfRunning() ? 0.55 : clamp(s.fuel / 40, 0, 1);
  const flick = 0.85 + Math.sin(clockT * 13) * 0.08 + Math.sin(clockT * 7.3) * 0.07;
  $('fire').setAttribute('opacity', (fireLvl * flick).toFixed(2));
  $('flame1').setAttribute('transform', `translate(0 ${(1 - fireLvl) * 14}) scale(1 ${0.9 + Math.sin(clockT * 11) * 0.08})`);
  $('flame1').style.transformOrigin = '64px 506px';
  $('stove-glow').setAttribute('opacity', (fireLvl * flick * 0.75).toFixed(2));
  $('kettle-steam').style.display = s.heat > 45 ? '' : 'none';
  $('mug-steam').style.display = s.heat > 40 ? '' : 'none';
  if (s.mode === 'travel' && fireLvl > 0.05) { crackleT -= dt; if (crackleT <= 0) { crackleT = rnd(0.2, 1.4); Audio.crackle(); } }
  // lighting
  const n = nightFactor();
  const c = comfort();
  $('night-dark').setAttribute('opacity', (n * 0.62).toFixed(3));
  $('console-dark').setAttribute('opacity', (n * 0.3).toFixed(3));
  $('lamp-glow').setAttribute('opacity', (0.35 + n * 0.55 + Math.min(c, 30) / 60).toFixed(3));
  const coldF = clamp((40 - s.heat) / 34, 0, 1);
  $('cold-tint').setAttribute('opacity', (coldF * 0.35).toFixed(3));
  $('frost').setAttribute('opacity', clamp(coldness() * 0.55 + coldF * 0.45 + (s.frost <= 0 ? 0.3 : 0), 0, 0.97).toFixed(3));
  $('lamp-bulb').setAttribute('fill', coldF > 0.5 ? '#d8e6ef' : '#ffe2a0');
  // car rocking
  const sf = s.mode === 'travel' ? Math.min(1, s.speed / MAX_SPEED) : 0;
  rockT += dt * (0.6 + sf * 1.6);
  const ry = Math.sin(rockT * 3.1) * 0.9 * sf + Math.sin(rockT * 11) * 0.25 * sf;
  const rr = Math.sin(rockT * 1.7) * 0.18 * sf;
  $('car').style.transform = `translateY(${ry.toFixed(2)}px) rotate(${rr.toFixed(3)}deg)`;
  // survivor mood
  const low = s.vit.hunger < 25 || s.vit.thirst < 25 || s.vit.hp < 35 || s.heat < 28;
  $('survivor').style.transform = low ? 'translateY(3px)' : 'none';
  $('surv-head').style.transform = low ? 'rotate(-8deg)' : 'none';
  const sleepy = n > 0.6 && !low;
  $('surv-eyes-open').classList.toggle('hidden', sleepy);
  $('surv-eyes-closed').classList.toggle('hidden', !sleepy);
  Audio.setRumble(sf);
}

// =====================================================================
// Interactions: train
// =====================================================================
function feedStove() {
  if (selfRunning()) { toast('The motor runs itself now. The stove is just for cosiness.'); Audio.crackle(); return; }
  if (state.res.fuel <= 0) { toast('No firewood left. Stop at a building to find some.'); return; }
  if (state.fuel > 96) { toast('The firebox is full.'); return; }
  state.res.fuel -= 1; state.fuel = Math.min(100, state.fuel + WOOD_FUEL);
  Audio.stoke(); floater(62, 450, '+fuel');
  refresh();
}
function pullBrake() {
  if (state.mode !== 'travel') return;
  if (state.braking) return;
  const vis = state.buildings.filter(b => !b.visited && buildingVisible(b));
  if (vis.length) { stopAt(vis.sort((a, b) => Math.abs(a.x + a.w / 2 - 200) - Math.abs(b.x + b.w / 2 - 200))[0]); return; }
  toast('Nothing worth stopping for. Tap a building as it passes the window.');
  Audio.click();
}
function stopAt(b) {
  if (state.mode !== 'travel' || state.braking) return;
  state.braking = true; state.brakeTarget = b.id;
  Audio.hiss(); Audio.whistle();
  if (!selfRunning()) toast(`Braking. The frost will gain about ${STOP_COST} km while you search.`);
  updateBrakeVisual();
  if (state.speed <= 0.1) { state.braking = false; enterExpedition(b); }
}
function petCat(e) {
  if (!state.cat.rescued) return;
  const spot = CAT_SPOTS[state.cat.spot];
  Audio.purr(); hearts(spot.x - 6, spot.y - 46);
  if (state.cat.pettedDay !== state.day) {
    state.cat.pettedDay = state.day; state.vit.hp = clamp(state.vit.hp + 5, 0, 100);
    floater(spot.x, spot.y - 60, '+5 health');
    addLog(`Spent a while scratching ${catName()} behind the ears.`);
  } else if (Math.random() < 0.3) showCatBubble(pick(['prrrr', 'mrrp!', '...zzz']));
}
function toggleSound() {
  Audio.init(); Audio.setOn(!Audio.on);
  $('cap-mute').classList.toggle('hidden', Audio.on);
  if (!Audio.on) Audio.musicBox(false); else if (musicOn) Audio.musicBox(true);
  toast(Audio.on ? 'Sound on: listen to the wheels.' : 'Sound off.');
}
function toggleRecord() {
  musicOn = !musicOn; Audio.musicBox(musicOn && Audio.on);
  refresh();
  if (musicOn && state.cat.rescued) setTimeout(() => showCatBubble('♪'), 600);
}

const ACTIONS = {

  drink: () => { state.res.water--; state.vit.thirst = clamp(state.vit.thirst + 40, 0, 100); Audio.click(); openPantry(); },
  tea: () => {
    if (state.teaDay !== state.day) { state.teaDay = state.day; state.teaCups = 0; }
    state.res.water--; state.teaCups++; state.vit.stamina = Math.min(MAX_STAMINA, state.vit.stamina + 1);
    Audio.hiss(); addLog('Brewed a strong cup of tea. Ready for another look around.'); floater(110, 380, '+1 energy'); openPantry();
  },
  sleep: () => { if (state.t < 0.6) return; closePaper(); addLog('Turned in early.'); state.t = 1; },
  cure: id => {
    const C = CONDS[id]; if (!C || !hasCond(id) || !canAfford(C.cure)) return;
    pay(C.cure); delete state.conds[id]; Audio.click(); toast(C.cured); addLog(C.cured); refresh(); openPantry();
  },
  ledger: () => openLedger(),
  ltog: k => { if (ledger) { ledger[k] = !ledger[k]; Audio.click(); openLedger(); } },
  ledgerSleep: () => {
    const warm = applyLedger(); closePaper(); morning();
    if (!warm && Math.random() < 0.45) addCond('fever', 'You woke up shivering and burning at once. A fever.');
    if (state.vit.hp <= 0) die('The cold took you in the night.');
  },
  heal: () => { if (state.conds) delete state.conds.cut; state.res.meds--; state.vit.hp = clamp(state.vit.hp + 35, 0, 100); Audio.click(); openPantry(); },
  feedcat: () => { state.res.food--; state.cat.hunger = 100; Audio.meow(); addLog(`Filled ${catName()}'s bowl. She ate like a lion.`); openPantry(); },
  sound: () => { toggleSound(); openManual(); },
  reset: () => { if (confirm('Erase this journey and start again?')) { clearSave(); state = newState(); closePaper(); startJourney(true); } },
  bptab: a => openBlueprints(a),
  buildWeapon: () => {
    const w = KIT_WEAPONS[state.kit.weapon + 1]; if (!w || !canAfford(w.cost)) return;
    pay(w.cost); state.kit.weapon++; Audio.hit(); addLog(`Made a ${w.name}.`); toast(`${w.name}: ready for the ruins.`); openBlueprints('kit');
  },
  buildCoat: () => {
    if (state.kit.coat || !canAfford(KIT_COAT.cost)) return;
    pay(KIT_COAT.cost); state.kit.coat = true; Audio.loot(); addLog('Stitched a padded coat.'); toast('Padded Coat: a little safer out there.'); openBlueprints('kit');
  },
  buildEngine: () => {
    const e = ENGINE[state.engine]; if (!e || !canAfford(e.cost)) return;
    pay(e.cost); state.engine++; Audio.click(); Audio.loot();
    addLog(`Fitted the ${e.name}.`);
    if (state.engine >= 5) { closePaper(); winSequence(); return; }
    toast(`${e.name} fitted.`); openBlueprints('engine');
  },
  buildDecor: id => {
    const d = DECOR.find(x => x.id === id); if (!d || !canAfford(d.cost)) return;
    pay(d.cost); state.decor[id] = true; Audio.loot();
    addLog(`Made a ${d.name} for the car.`);
    if (id === 'catbed' && state.cat.rescued) { state.cat.spot = 'bed'; placeCat(false); }
    closePaper(); toast(`${d.name}: the car feels cosier.`);
  },
  choice: i => resolveNight(+i),
  morning: () => { closePaper(); morning(); },
  catYes: () => {
    const nm = CAT_NAME;
    state.cat.rescued = true; state.cat.spot = 'stove'; state.cat.name = nm; Audio.meow();
    addLog(`Found a thin black cat in the rubble. Named her ${nm}.`); closePaper(); renderExpedition(); toast(`${nm} rides home in your coat.`);
  },
  trade: i => {
    const o = currentOffers[+i]; if (!o || state.res[o.pay] < o.pq) return;
    state.res[o.pay] -= o.pq; state.res[o.give] += o.gq; Audio.coin();
    addLog(`Traded ${o.pq} ${RES[o.pay].short} for ${o.gq} ${RES[o.give].short} with a stranger at the door.`);
    closePaper(); toast('A fair trade. The stranger tips their hat.');
    flyLoot(Array(o.gq).fill(o.give), [392, 470]); refresh();
  },
  tradeGift: () => { state.res.food++; addLog('A stranger left a tin of food at the door.'); closePaper(); flyLoot(['food'], [392, 470]); refresh(); },
  catNo: () => { addLog('Left a little food for a stray cat.'); closePaper(); renderExpedition(); },
  win: () => { closePaper(); toast('Keep scavenging for furniture and decor. Make it home.'); },

let currentEvent = null;

  h += `<h2>${fmt(currentEvent.title)}</h2><p><span class="tg-strip">${fmt(currentEvent.text)}</span></p>`;
  currentEvent.choices.forEach((c, i) => {
    const ok = !c.cond || c.cond(s);
    h += `<button class="ink-btn" data-act="choice" data-arg="${i}" ${ok ? '' : 'disabled'}>&#9656; ${fmt(c.label)}${c.note ? ` <span style="opacity:.7">(${c.note})</span>` : ''}${!ok && c.need ? `<span class="need">${c.need}</span>` : ''}</button>`;
  });

}
function resolveNight(i) {
  const c = currentEvent.choices[i]; if (!c) return;
  const out = fmt(c.apply(state));
  addLog(out); Audio.click();
  const h = `<div class="tg-head">HEARTH &amp; ASH LINE &middot; NIGHT ${state.day}</div><h2>${fmt(currentEvent.title)}</h2><p>${out}</p><button class="ink-btn" data-act="ledger">&#9656; Settle the night\u2019s ledger</button>`;

// ---- night ledger: what you spend to get through the night ----
let ledger = null;
const stoveNightCost = () => (selfRunning() || state.engine >= 3) ? 0 : 2 + (state.day >= 6 ? 1 : 0);
function openLedger() {
  const s = state, sc = stoveNightCost();
  if (!ledger) ledger = { supper: s.res.food >= 1, water: s.res.water >= 1, cat: s.cat.rescued && s.res.food >= 2, stove: sc === 0 || s.res.fuel >= sc };
  const foodUse = (ledger.supper ? 1 : 0) + (ledger.cat ? 1 : 0);
  const row = (key, label, cost, skip, can) => {
    const on = ledger[key];
    return `<button class="ink-btn ledger-row ${on ? 'on' : ''}" data-act="ltog" data-arg="${key}" ${!on && !can ? 'disabled' : ''}><span class="box">${on ? '&#10003;' : ''}</span><span><b>${label}</b><span class="lc">${cost}</span>${on ? '' : `<span class="need">${skip}</span>`}${!on && !can ? '<span class="need">You don\u2019t have enough.</span>' : ''}</span></button>`;
  };
  let h = `<h2>Night ledger</h2><div class="sub" style="font-family:Caveat;font-size:19px">Night ${s.day} &middot; ${tempStr()} outside &middot; in stock: ${icon('food', 15)} ${s.res.food} &nbsp;${icon('water', 15)} ${s.res.water} &nbsp;${icon('fuel', 15)} ${s.res.fuel}</div>`;
  h += row('supper', 'Supper', `1 ${icon('food', 15)}`, 'Skipped: you wake up starving.', s.res.food - foodUse >= 1);
  h += row('water', 'A cup of water', `1 ${icon('water', 15)}`, 'Skipped: you wake up parched.', s.res.water >= 1);
  if (s.cat.rescued) h += row('cat', `Fill ${catName()}\u2019s bowl`, `1 ${icon('food', 15)}`, 'Skipped: she sulks and won\u2019t warn you about buildings tomorrow.', s.res.food - foodUse >= 1);
  if (sc === 0) h += `<div class="ledger-free">${icon('candle', 17)} ${selfRunning() ? 'The motor' : 'The dynamo battery'} keeps the car warm and the wheels turning all night.</div>`;
  else h += row('stove', 'Keep the stove in and roll on through the night', `${sc} ${icon('fuel', 15)}`, `Skipped: the train stands still all night. The frost gains ~${Math.round(nightFrost())} km, and you freeze (health, maybe a fever).`, s.res.fuel >= sc);
  h += `<button class="ink-btn" data-act="ledgerSleep" style="margin-top:14px;text-align:center">Blow out the lamp and sleep &rarr;</button>`;
  openPaper('journal', h, true);
}
function applyLedger() {
  const s = state, L = ledger || {}, sc = stoveNightCost(), notes = [];
  if (L.supper && s.res.food > 0) { s.res.food--; s.vit.hunger = clamp(s.vit.hunger + 35, 0, 100); }
  else { s.vit.hunger = clamp(s.vit.hunger - 25, 0, 100); notes.push('went to bed hungry'); }
  if (L.water && s.res.water > 0) { s.res.water--; s.vit.thirst = clamp(s.vit.thirst + 40, 0, 100); }
  else { s.vit.thirst = clamp(s.vit.thirst - 25, 0, 100); notes.push('went to bed thirsty'); }
  if (s.cat.rescued) {
    if (L.cat && s.res.food > 0) { s.res.food--; s.cat.hunger = 100; s.cat.sulkDay = 0; }
    else { s.cat.hunger = clamp(s.cat.hunger - 40, 0, 100); s.cat.sulkDay = s.day + 1; notes.push(`${catName()} went without`); }
  }
  let warm = true;
  if (sc > 0) { if (L.stove && s.res.fuel >= sc) s.res.fuel -= sc; else warm = false; }
  s.lastWarm = warm;
  s.frost = clamp(s.frost + (warm ? maxSpeed() / 60 * 15 - nightFrost() : -nightFrost()), 0, 60);
  if (!warm) { s.vit.hp = clamp(s.vit.hp - 12, 0, 100); s.heat = Math.min(s.heat, 18); notes.push('let the stove go out and the frost gained'); }
  ledger = null;
  if (notes.length) addLog(`Night ${s.day}: ${notes.join(', ')}.`);
  return warm;
}
function morning() {
  const s = state;
  s.day++; s.t = 0.02;
  s.vit.stamina = Math.max(1, MAX_STAMINA - s.staminaPenalty - (hasCond('sprain') ? 1 : 0)); s.staminaPenalty = 0;
  s.knockAt = Math.random() < 0.55 ? rnd(0.2, 0.6) : null;
  const got = [];
  if (s.decor.planter) { s.res.food++; got.push('+1 food from the herb box'); }
  if (s.decor.rain) { s.res.water++; got.push('+1 water from the rain jug'); }
  const C = s.conds || {};
  if (C.sprain && s.day - C.sprain.d >= 3) { delete C.sprain; got.push('your ankle has mended'); }
  if (C.fever) { if (s.lastWarm) C.fever.warm++; if (C.fever.warm >= 2) { delete C.fever; got.push('the fever broke'); } }
  if (s.cat.rescued && s.cat.hunger <= 0) addLog(`${catName()} was hungry all night and sulked.`);
  toast(`Day ${s.day}, ${tempStr()}, frost ${Math.floor(s.frost)} km behind. ${hasCond('sprain') ? 'Your ankle aches: one less candle.' : 'Rested: energy refilled.'}${got.length ? ' ' + got.join(', ') + '.' : ''}`);
  addLog(`Day ${s.day} began${got.length ? ': ' + got.join(', ') : ''}.`);
  refresh(); save();
}

// =====================================================================
// Expedition (short Skyhill-style run)
// =====================================================================
function rollRoom(type, fi, name, floorDef) {
  const r = Math.random() * 100;
  let out;
  const trap = floorDef.risk * 0.4;
  const snag = 8 + fi * 3, stash = 5;
  if (r < trap) out = { kind: 'hazard', dmg: 6 + fi * 5 };
  else if (r < trap + snag) out = { kind: 'snag', sub: pick(['rats', 'nail', 'draught', 'jam']) };
  else if (r < trap + snag + 10) out = { kind: 'empty' };
  else if (r < trap + snag + 10 + stash) out = { kind: 'stash' };
  else {
    let lt = pick(floorDef.pool);
    if (lt === 'blueprint' && !unknownBlueprints(type).length) lt = 'cloth';
    out = { kind: 'loot', item: lt, qty: lt === 'blueprint' ? 1 : (fi >= 1 && Math.random() < 0.45 ? 2 : 1) };
  }
  const key = out.kind === 'loot' ? out.item : out.kind;
  const honest = Math.random() < 0.75;
  const hintKey = honest ? key : pick(Object.keys(HINTS));
  return { name, out, hint: pick(HINTS[hintKey]), explored: false, result: null, pending: null };
}
function enterExpedition(b) {
  const T = BTYPES[b.type];
  const floors = T.floors.map((f, fi) => {
    const n = b.type === 'shed' ? 2 : (Math.random() < 0.5 ? 2 : 3);
    const names = [...f.names].sort(() => Math.random() - 0.5).slice(0, n);
    return { label: f.label, rooms: names.map(nm => rollRoom(b.type, fi, nm, f)) };
  });
  if (!state.cat.rescued && b.type === 'apartment') {
    const room = floors[0].rooms[floors[0].rooms.length - 1];
    room.out = { kind: 'cat' }; room.hint = 'a faint, thin meow...'; room.cat = true;
  }
  // one room per floor (but the top) holds the stairs up
  floors.forEach((f, fi) => { if (fi < floors.length - 1) { const opts = f.rooms.filter(r => !r.cat); (opts.length ? pick(opts) : f.rooms[0]).stairs = true; } });
  // monsters: one per pair of eyes seen in the windows, weighted to upper floors
  const cand = [];
  floors.forEach((f, fi) => f.rooms.forEach(r => { if (!r.cat) cand.push({ r, fi }); }));
  let m = Math.min(b.monsters || 0, cand.length - 1);
  while (m-- > 0 && cand.length) {
    const tot = cand.reduce((a, c) => a + c.fi + 1, 0); let roll = Math.random() * tot; let idx = 0;
    for (; idx < cand.length - 1; idx++) { roll -= cand[idx].fi + 1; if (roll <= 0) break; }
    const c = cand.splice(idx, 1)[0]; const prev = c.r.out;
    c.r.out = { kind: 'monster', mtype: pickMonster(b.type, c.fi, floors.length),

  const low = v.hunger < 25 || v.thirst < 25 || v.hp < 35;
  const chill = Math.max(clamp((45 - s.heat) / 40, 0, 1), coldness() * 0.35);
  const sad = clamp(Math.max(low ? 0.75 : 0, chill, (!selfRunning() && s.fuel <= 0) ? 0.7 : 0, Object.keys(s.conds || {}).length * 0.3), 0, 1);
  let danger = 0;
  if (s.exp && s.exp.floors) {
    const unl = s.exp.floors.filter((_, fi) => floorUnlocked(fi)).length;
    danger = clamp((unl - 1) * 0.3 + (v.hp < 40 ? 0.35 : 0) + (s.exp.combat ? 0.3 : 0), 0, 1);
  }
  Audio.setMood({ sad, night: nightFactor(), rich: clamp(comfort() / 20, 0, 1), danger, chill, frostNear: !selfRunning() && s.frost < 9, lowHp: v.hp < 35 });
}
let moodT = 0;
function frame(now) {
  if (++moodT > 60) { moodT = 0; if (!titleOpen) updateMood(); }
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!titleOpen && !paperOpen) update(dt);
  render(titleOpen ? dt * 0.4 : (paperOpen ? 0 : dt));
  requestAnimationFrame(frame);
}

(function boot() {
  buildStatic();
  const saved = load();
  state = saved || newState();
  if (saved && !saved.dead) { $('btn-board').textContent = 'Continue Journey'; $('btn-new').classList.remove('hidden'); }
  else state = newState();
  // title backdrop: train idles gently
  state.speed = state.mode === 'travel' ? Math.max(state.speed, 0) : 0;
  resize(); window.addEventListener('resize', resize);
  refresh();
  $('btn-board').addEventListener('click', () => startJourney(!saved || saved.dead));
  $('btn-new').addEventListener('click', () => { clearSave(); state = newState(); startJourney(true); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('beforeunload', save);
  // dev hook for testing
  window.__game = { get state() { return state; }, triggerNight, spawnBuilding, openBlueprints, enterExpedition };
  requestAnimationFrame(frame);
  // ---- dev / screenshot hooks: #dev, #dev-cozy, #dev-exp, #dev-bp, #dev-night ----
  const hsh = location.hash;
  if (hsh.startsWith('#dev')) {
    state = newState(); state.introDone = true; startJourney(true);
    state.speed = 60; state.t = 0.35;
    spawnBuilding('pharmacy', 60); state.buildings[0].fade = 1; state.buildings[0].monsters = 2;
    if (hsh === '#dev-dusk') state.t = 0.74;
    if (hsh === '#dev-cozy' || hsh === '#dev-night') {
      DECOR.forEach(d => state.decor[d.id] = true); state.cat.rescued = true; state.cat.spot = 'sillR';
      Object.assign(state.res, { food: 5, water: 4, fuel: 6, scrap: 4, parts: 2, meds: 2, cloth: 3 }); state.engine = 3;
      musicOn = false; refresh();
    }
    if (hsh === '#dev-night') { state.t = 0.9; state.cat.spot = 'lap'; refresh(); }
    if (hsh === '#dev-exp') document.head.insertAdjacentHTML('beforeend', '<style>#expedition,#fade{animation:none!important;transition:none!important}</style>');
    if (hsh === '#dev-exp') enterExpedition(spawnBuilding('apartment', 100) || state.buildings[state.buildings.length - 1]);
    if (hsh === '#dev-fight') {
      document.head.insertAdjacentHTML('beforeend', '<style>#expedition,#fade,#cb-mon{animation:none!important;transition:none!important}</style>');
      spawnBuilding('apartment', 100); const fb = state.buildings[state.buildings.length - 1]; fb.monsters = 3;
      enterExpedition(fb); const fl = state.exp.floors[state.exp.floors.length - 1];
      fl.rooms[0].out = { kind: 'monster', mtype: (location.search.slice(1) || 'hollow'), loot: null }; state.vit.stamina = 5;
      startCombat(state.exp.floors.length - 1, 0);
    }
    if (hsh === '#dev-frost') { state.frost = 6; state.day = 6; refresh(); }
    if (hsh === '#dev-ledger') { state.cat.rescued = true; state.day = 6; Object.assign(state.res, { food: 1, water: 2, fuel: 2 }); openLedger(); }
    if (hsh === '#dev-hurt') { state.day = 9; state.conds = { sprain: { d: 9, warm: 0 }, cut: { d: 9, warm: 0 }, fever: { d: 9, warm: 0 } }; state.heat = 30; refresh(); }
    if (hsh === '#dev-knock') { Object.assign(state.res, { scrap: 1, food: 5, water: 4, cloth: 3 }); openTrade(); }
    if (hsh === '#dev-loot') { state.speed = 0; Object.assign(state.res, { fuel: 0, food: 0, scrap: 0 }); state.res.fuel = 3; state.res.food = 2; state.res.scrap = 1; flyLoot(['fuel', 'fuel', 'fuel', 'food', 'food', 'scrap'], [200, 190]); refresh(); }
    if (hsh === '#dev-bp') { Object.assign(state.res, { scrap: 4, parts: 1, cloth: 2 }); openBlueprints('home'); }
  }
})();
</script>
